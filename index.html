async function profile(un){const{data:x}=await sb.from('profiles').select('*').eq('username',un).maybeSingle();if(!x)return empty('Account not found','This profile does not exist or is unavailable.');PR[x.id]=x;
const[a,b]=await Promise.all([sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',x.id),sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',x.id)]),own=x.id==ME,f=S.fg.includes(x.id);let ps=[];
if(S.tab=='p')ps=await getPosts(q=>q.eq('author_id',x.id).is('parent_id',null).order('created_at',{ascending:false}).limit(S.n));else if(S.tab=='r')ps=await getPosts(q=>q.eq('author_id',x.id).not('parent_id','is',null).order('created_at',{ascending:false}).limit(S.n));
else if(S.tab=='m')ps=(await getPosts(q=>q.eq('author_id',x.id).is('parent_id',null).order('created_at',{ascending:false}).limit(60))).filter(p=>(p.media||[]).length);
else{const ids=((await sb.from('likes').select('post_id').eq('user_id',x.id)).data||[]).map(i=>i.post_id);ps=ids.length?await getPosts(q=>q.in('id',ids).order('created_at',{ascending:false})):[]}
const lock=x.is_private&&!own&&!f&&!ps.length;
return `<div class="ban" style="${x.banner_url?`background-image:url(${esc(x.banner_url)})`:''}"></div><div class="pad"><div class="row sp" style="align-items:flex-start">${av(x,'l')}<div class="row">${own?'<a class="btn o" href="#settings">Edit profile</a>':`<button class="btn o" data-a="chat" data-id="${x.id}">Message</button><button class="btn ${f?'o':''}" data-a="fol" data-id="${x.id}" data-on="${+f}">${f?'Unfollow':'Follow'}</button>`}</div></div><div class="hd" style="margin-top:8px"><b style="font-size:20px">${esc(x.display_name)}</b>${badge(x)}</div><div class="mu">@${x.username}${x.is_private?' · Private':''}</div><div style="margin:8px 0">${fmt(x.bio||'')}</div><div class="mu">Joined ${new Date(x.created_at).toLocaleDateString(undefined,{month:'long',year:'numeric'})} · <b style="color:var(--tx)">${b.count||0}</b> following · <b style="color:var(--tx)">${a.count||0}</b> followers</div></div><div class="tabs">${[['p','Posts'],['r','Replies'],['m','Media'],['l','Likes']].map(t=>`<button class="${S.tab==t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${lock?empty('This account is private','Follow to see their posts.'):ps.length?ps.map(p=>card(p)).join(''):empty('Nothing here yet','')}`}
async function settings(){const m=MP,bl=((await sb.from('blocks').select('blocked_id').eq('blocker_id',ME)).data||[]).map(x=>x.blocked_id);await need(bl);
return `<div class="pad"><label class="f">Display name</label><input id="s-n" value="${esc(m.display_name)}" maxlength="40"><label class="f">Username</label><input id="s-u" value="${esc(m.username)}" maxlength="15"><label class="f">Biography</label><textarea id="s-b" maxlength="160" rows="3">${esc(m.bio)}</textarea><label class="f">Profile picture</label><input type="file" id="fa" accept="image/*"><label class="f">Banner</label><input type="file" id="fb" accept="image/*"><label class="f"><input type="checkbox" id="s-p" ${m.is_private?'checked':''} style="width:auto"> Private account (only followers see my posts)</label><div class="err" id="e1"></div><button class="btn" data-a="saveprof">Save profile</button>
<h3>Password</h3><input type="password" id="p0" placeholder="Current password"><div style="height:8px"></div><input type="password" id="p1" placeholder="New password (8+ characters)"><div class="err" id="e2"></div><button class="btn o" data-a="savepw">Change password</button>
<h3>Theme</h3><div class="row"><button class="btn ${th()!='light'?'':'o'}" data-a="theme" data-v="dark">Dark</button><button class="btn ${th()=='light'?'':'o'}" data-a="theme" data-v="light">Light</button></div>
<h3>Blocked users</h3>${bl.length?bl.map(i=>PR[i]?`<div class="row sp" style="margin:6px 0"><span>@${PR[i].username}</span><button class="btn o sm" data-a="unblk" data-id="${i}">Unblock</button></div>`:'').join(''):'<div class="mu">No blocked users.</div>'}<h3>Account</h3><button class="btn d" data-a="logout">Log out</button></div>`}
function shell(T,B){const nav=[['home','Home','home'],['explore','Explore','explore'],['notifications','Notifications','notifications'],['messages','Messages','messages'],['create','Create Post','create'],['bookmarks','Bookmarks','bookmarks'],['u-'+MP.username,'Profile','user'],['settings','Settings','settings']],on=k=>k==S.v?'on':'',cnt=k=>k=='notifications'&&S.un?`<span class="dot">${S.un}</span>`:k=='messages'&&S.um?`<span class="dot">${S.um}</span>`:'';
const a=document.activeElement,id=a&&a.id,v=a&&a.value;
$('#app').innerHTML=`<div class="app"><nav class="side"><div class="logo"><span class="lg">L</span>Ligma-Social</div>${nav.map(n=>`<a class="ni ${on(n[0])}" href="#${n[0]}">${ic(n[2])}${n[1]}${cnt(n[0])}</a>`).join('')}<div class="gap"></div><div class="ni" style="cursor:default">${av(MP,'s')}<span>@${MP.username}</span></div></nav><main class="main" id="mn"><div class="top"><span>${T}</span></div>${B}</main><nav class="bot">${nav.map(n=>`<a class="${on(n[0])}" href="#${n[0]}" aria-label="${n[1]}">${ic(n[2],22)}${cnt(n[0])}</a>`).join('')}</nav></div>`;
if(id&&id!='dt'&&$('#'+id)){$('#'+id).value=v;$('#'+id).focus()}}
async function paint(){const t=++tok;document.documentElement.dataset.theme=th();if(!ME||!MP)return authView();const v=S.v;let T='Ligma-Social',B;
try{await counts();if(S.open)S.cm=await getPosts(b=>b.eq('parent_id',S.open).order('created_at'));
if(v=='home'){T='Home';B=await home()}else if(v=='create'){T='Create Post';B=composer()}else if(v=='explore'){T='Explore';B=await explore()}else if(v=='notifications'){T='Notifications';B=await notifs()}else if(v=='messages'){T='Messages';B=await messages()}else if(v=='bookmarks'){T='Bookmarks';B=await bookmarks()}else if(v=='settings'){T='Settings';B=await settings()}else if(v.startsWith('u-')){T='Profile';B=await profile(v.slice(2))}else{T='Not found';B=empty('Page not found','Use the navigation to get back.')}}
catch(e){B=empty('Something went wrong',esc(e.message||e))}
if(t==tok)shell(T,B)}
function authView(){const r=S.auth=='up';$('#app').innerHTML=`<div class="auth"><div class="logo"><span class="lg">L</span>Ligma-Social</div><p class="mu" style="text-align:center">${r?'Create your account':'Welcome back'}</p>${r?'<label class="f">Username</label><input id="a-u" maxlength="15" autocomplete="username">':''}<label class="f">Email</label><input id="a-e" type="email" autocomplete="email"><label class="f">Password</label><input id="a-p" type="password" autocomplete="${r?'new-password':'current-password'}"><div class="err">${esc(S.err)}</div>${S.msg?`<p class="mu">${esc(S.msg)}</p>`:''}<button class="btn" style="width:100%" data-a="auth">${r?'Create account':'Log in'}</button><p style="text-align:center"><button class="mu" data-a="swap">${r?'Have an account? Log in':'New here? Register'}</button></p></div>`}
function route(){const v=location.hash.slice(1)||'home';if(v!=S.v){S.v=v;S.n=10;S.open=null;S.tab='p';if(ME&&MP&&$('#mn'))$('#mn').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>'}paint()}
function rt(){if(RT)sb.removeChannel(RT);RT=sb.channel('rt-'+ME).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'recipient_id=eq.'+ME},()=>{if(!/INPUT|TEXTAREA/.test(document.activeElement.tagName)||S.v=='messages')paint()}).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+ME},()=>{if(!/INPUT|TEXTAREA/.test(document.activeElement.tagName))paint()}).subscribe()}
const up=async(b,f)=>{if(f.size>8e6){toast('File too large (max 8 MB)');return null}const p=`${ME}/${Date.now()}-${f.name.replace(/[^\w.]/g,'_')}`,{error}=await sb.storage.from(b).upload(p,f);if(error){toast(error.message);return null}return sb.storage.from(b).getPublicUrl(p).data.publicUrl};
document.addEventListener('input',e=>{if(e.target.id=='dt')S.dt=e.target.value});
document.addEventListener('keydown',e=>{if(e.key!='Enter'||e.shiftKey)return;const id=e.target.id,b={sq:'search',mi:'send',nu:'newchat','a-p':'auth'}[id]||(id.startsWith('c-')?'cmt':'');if(b){e.preventDefault();act(b,{id:id.slice(2)})}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id=='fm'){[...t.files].slice(0,4-S.dm.length).forEach(f=>S.dm.push({f,u:URL.createObjectURL(f),t:f.type.startsWith('video')?'video':'image'}));paint()}
if(t.id=='fa'||t.id=='fb'){const f=t.files[0];if(!f)return;const u=await up(t.id=='fa'?'avatars':'banners',f);if(u){const k=t.id=='fa'?'avatar_url':'banner_url',{error}=await sb.from('profiles').update({[k]:u}).eq('id',ME);if(error)return toast(error.message);MP[k]=u;PR[ME]=MP;toast('Image updated');paint()}}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&t.dataset.a)act(t.dataset.a,t.dataset)});
window.addEventListener('hashchange',route);
const tbl={like:'likes',rp:'reposts',bk:'bookmarks'},err=r=>{if(r&&r.error){toast(r.error.message);return 1}};
async function act(a,d){
if(a=='swap'){S.auth=S.auth=='in'?'up':'in';S.err=S.msg='';return authView()}
if(a=='auth'){const em=val('a-e'),pw=$('#a-p').value;S.err=S.msg='';
if(S.auth=='up'){const un=val('a-u');if(!/^\w{3,15}$/.test(un))S.err='Username: 3-15 letters, numbers or underscores.';else if(!/^\S+@\S+\.\S+$/.test(em))S.err='Enter a valid email.';else if(pw.length<8)S.err='Password needs 8+ characters.';
if(!S.err){const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{username:un}}});if(error)S.err=/database/i.test(error.message)?'That username is taken.':error.message;else if(!data.session)S.msg='Check your email to confirm your account, then log in.'}}
else{const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)S.err=error.message}
return authView()}
if(!ME)return;
switch(a){
case'logout':await sb.auth.signOut();return;
case'tag':S.q='#'+d.v;return paint();case'search':S.q=val('sq');return paint();case'more':S.n+=10;return paint();case'feed':S.feed=d.v;return paint();case'tab':S.tab=d.v;S.n=10;return paint();
case'open':S.open=S.open==d.id?null:d.id;return paint();
case'post':{const tx=$('#dt').value.trim();if(!tx&&!S.dm.length)return toast('Write something or add media');const b=$('#pb');b.disabled=true;b.textContent='Posting...';const md=[];for(const m of S.dm){const u=await up('media',m.f);if(!u){b.disabled=false;b.textContent='Post';return}md.push({type:m.t,url:u})}
if(err(await sb.from('posts').insert({author_id:ME,body:tx,media:md}))){b.disabled=false;b.textContent='Post';return}S.dt='';S.dm=[];toast('Posted');if(S.v=='create')location.hash='home';return paint()}
case'cmt':{const tx=val('c-'+d.id);if(!tx)return toast('Write a reply first');if(!err(await sb.from('posts').insert({author_id:ME,body:tx,parent_id:d.id})))paint();return}
case'like':case'rp':case'bk':{const t=sb.from(tbl[a]),k={user_id:ME,post_id:d.id};err(d.on=='1'?await t.delete().match(k):await t.insert(k));return paint()}
case'share':try{await navigator.clipboard.writeText(location.href);toast('Link copied')}catch(e){toast('Copy not available here')}return;
case'del':if(confirm('Delete this post?'))err(await sb.from('posts').delete().match({id:d.id,author_id:ME}));return paint();
case'rep':{const r=prompt('Why are you reporting this post?');if(r&&r.trim()&&!err(await sb.from('reports').insert({reporter_id:ME,post_id:d.id,reason:r.trim().slice(0,300)})))toast('Report submitted');return}
case'blk':if(confirm('Block this user?')){if(!err(await sb.from('blocks').insert({blocker_id:ME,blocked_id:d.id}))){await sb.from('follows').delete().match({follower_id:ME,following_id:d.id});toast('User blocked')}}return paint();
case'unblk':err(await sb.from('blocks').delete().match({blocker_id:ME,blocked_id:d.id}));return paint();
case'fol':{const t=sb.from('follows'),k={follower_id:ME,following_id:d.id};err(d.on=='1'?await t.delete().match(k):await t.insert(k));return paint()}
case'chat':S.chat=d.id;if(location.hash!='#messages')location.hash='messages';else paint();return;case'back':S.chat=null;return paint();
case'newchat':{const{data:x}=await sb.from('profiles').select('id').eq('username',val('nu').replace('@','')).maybeSingle();if(!x||x.id==ME)return toast('User not found');S.chat=x.id;return paint()}
case'send':{const tx=val('mi');if(!tx||!S.chat)return;if(!err(await sb.from('messages').insert({sender_id:ME,recipient_id:S.chat,body:tx}))){await paint();$('#mi')?.focus()}return}
case'theme':try{localStorage.setItem('ls-theme',d.v)}catch(e){}return paint();
case'saveprof':{const n=val('s-n'),un=val('s-u');let er='';if(!n)er='Display name is required.';else if(!/^\w{3,15}$/.test(un))er='Username: 3-15 letters, numbers or underscores.';if(er){$('#e1').textContent=er;return}
const{data,error}=await sb.from('profiles').update({display_name:n,username:un,bio:val('s-b'),is_private:$('#s-p').checked}).eq('id',ME).select().single();if(error){$('#e1').textContent=error.code=='23505'?'That username is taken.':error.message;return}MP=data;PR[ME]=data;toast('Profile saved');return paint()}
case'savepw':{const n=$('#p1').value;if(n.length<8)return $('#e2').textContent='New password needs 8+ characters.';const{error:e1}=await sb.auth.signInWithPassword({email:(await sb.auth.getUser()).data.user.email,password:$('#p0').value});if(e1)return $('#e2').textContent='Current password is wrong.';const{error}=await sb.auth.updateUser({password:n});if(error)return $('#e2').textContent=error.message;toast('Password changed');return paint()}}}
sb.auth.onAuthStateChange((ev,ses)=>setTimeout(async()=>{const id=ses?.user?.id||null;if(id&&id==ME&&MP)return;ME=id;MP=null;if(id){const{data}=await sb.from('profiles').select('*').eq('id',id).single();MP=data;if(data)PR[id]=data;rt();if(location.hash.length<2)location.hash='home'}else if(RT){sb.removeChannel(RT);RT=null}S.v=location.hash.slice(1)||'home';paint()},0));
</script></body></html>
