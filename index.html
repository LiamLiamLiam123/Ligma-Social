<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Ligma-Social</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0f0f0f;--bg2:#1a1a1a;--bd:#2c2c2c;--tx:#f2f2f2;--mu:#8b8f8d;--ac:#00ff7b;--rd:#ff4d5e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=light]{--bg:#fff;--bg2:#f1f4f2;--bd:#dfe3e1;--tx:#0f0f0f;--mu:#69706c;--ac:#00d468;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .2s}
a{color:inherit;text-decoration:none}.tx a{color:var(--ac)}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:flex;max-width:960px;margin:0 auto}.side{width:240px;padding:14px 10px;position:sticky;top:0;height:100dvh;align-self:flex-start;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:6px 14px 16px}.lg{width:30px;height:30px;border-radius:9px;background:var(--ac);color:#000;display:grid;place-items:center;font-weight:900}
.ni{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:99px;font-size:16px;transition:.15s}.ni:hover{background:var(--bg2)}.ni.on{font-weight:700;color:var(--ac)}.dot{background:var(--ac);color:#000;border-radius:99px;font-size:11px;font-weight:700;padding:0 6px;margin-left:auto}
.main{flex:1;min-width:0;border:1px solid var(--bd);border-width:0 1px;min-height:100dvh}.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:14px 16px;font-weight:700;font-size:18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.bot{display:none}.pad{padding:14px 16px}.row{display:flex;gap:12px;align-items:flex-start}.sp{justify-content:space-between;align-items:center}.fl{flex:1;min-width:0}.mu{color:var(--mu);font-size:13px}.gap{flex:1}
.btn{background:var(--ac);color:#000;border-radius:99px;padding:8px 18px;font-weight:700;transition:.15s;white-space:nowrap}.btn:hover{filter:brightness(1.1)}.btn.o{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--rd);color:#fff}.btn.sm{padding:5px 12px;font-size:13px}
input,textarea,select{width:100%;background:var(--bg2);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;outline:0;transition:.15s}input:focus,textarea:focus{border-color:var(--ac)}textarea{resize:vertical}label.f{display:block;margin:12px 0 4px;color:var(--mu);font-size:13px}
.card{padding:14px 16px;border-bottom:1px solid var(--bd);animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#000;background-size:cover;background-position:center}.av.l{width:84px;height:84px;font-size:30px;border:4px solid var(--bg);margin-top:-42px}.av.s{width:34px;height:34px;font-size:13px}
.hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.nm{font-weight:700}.tx{white-space:pre-wrap;word-break:break-word;margin-top:2px}.vb{color:var(--ac);display:inline-flex}
.md{display:grid;gap:3px;margin-top:8px;border-radius:14px;overflow:hidden;grid-template-columns:repeat(2,1fr)}.md>*:only-child{grid-column:1/-1}.md img,.md video{width:100%;max-height:360px;object-fit:cover;display:block}
.acts{display:flex;gap:4px;margin-top:8px;align-items:center;color:var(--mu);font-size:13px}.acts button{display:flex;gap:5px;align-items:center;padding:5px 10px;border-radius:99px;transition:.15s;color:var(--mu)}.acts button:hover{background:var(--bg2);color:var(--ac)}.acts .on{color:var(--ac)}.acts .on svg{fill:currentColor}
.tabs{display:flex;border-bottom:1px solid var(--bd)}.tabs button{flex:1;padding:12px;color:var(--mu);border-bottom:2px solid transparent;transition:.15s}.tabs .on{color:var(--tx);font-weight:700;border-color:var(--ac)}
.ban{height:150px;background:linear-gradient(120deg,#0a3d24,#00ff7b55);background-size:cover;background-position:center}.empty{text-align:center;color:var(--mu);padding:48px 24px}.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:4px}
.sk{height:84px;margin:12px 16px;border-radius:12px;background:linear-gradient(90deg,var(--bg2),var(--bd),var(--bg2));background-size:200% 100%;animation:sh 1.1s infinite}@keyframes sh{to{background-position:-200% 0}}
.prev{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.prev img,.prev video{width:70px;height:70px;object-fit:cover;border-radius:8px}
.bub{max-width:75%;padding:8px 12px;border-radius:16px;margin:3px 0;word-break:break-word}.me{background:var(--ac);color:#000;margin-left:auto;border-bottom-right-radius:4px}.th{background:var(--bg2);border-bottom-left-radius:4px}
.ct{padding:10px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--bd);cursor:pointer;transition:.15s}.ct:hover,.un{background:var(--bg2)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ac);color:#000;padding:9px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99}#toast.s{opacity:1}
.auth{max-width:380px;margin:8vh auto;padding:24px}.auth .logo{justify-content:center;font-size:26px}.err{color:var(--rd);font-size:13px;min-height:18px}
@media(max-width:760px){.side{display:none}.main{border:0}.bot{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg);border-top:1px solid var(--bd);justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}.bot a{padding:8px;position:relative;color:var(--mu)}.bot a.on{color:var(--ac)}.bot .dot{position:absolute;top:0;right:-2px;margin:0}.app{padding-bottom:64px}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const P={home:'<path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',explore:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',notifications:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/>',messages:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',create:'<path d="M12 5v14M5 12h14"/>',bookmarks:'<path d="M6 3h12v18l-6-4-6 4z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',heart:'<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-3 4.5 4.5 0 0 1 8 3c0 6-8 11-8 11z"/>',comment:'<path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z"/>',repost:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>',share:'<path d="M4 12v8h16v-8M12 3v13M7 8l5-5 5 5"/>',check:'<path d="M5 12l5 5 9-10"/>'};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const K='ligma-social-v1',$=s=>document.querySelector(s);let db,ME=null,S={n:10,feed:'c',tab:'p',dt:'',dm:[],q:'',open:null,chat:null,auth:'in',err:'',load:0,v:'home'};
try{ME=sessionStorage.getItem('ls-me')}catch(e){}
function load(){try{db=JSON.parse(localStorage.getItem(K))}catch(e){}db=db||{};['posts','notifs','msgs','reports'].forEach(k=>db[k]=db[k]||[]);db.users=db.users||{}}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Storage full. Remove some media.')}}
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36),u=i=>db.users[i],me=()=>db.users[ME];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byUn=n=>Object.values(db.users).find(x=>x.un.toLowerCase()==String(n).toLowerCase());
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?'now':s<3600?(s/60|0)+'m':s<86400?(s/3600|0)+'h':new Date(t).toLocaleDateString()};
const hs=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ls:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2200)}
const fmt=t=>esc(t).replace(/(^|\s)#(\w+)/g,'$1<a href="#explore" data-a="tag" data-v="$2">#$2</a>').replace(/(^|\s)@(\w+)/g,'$1<a href="#u-$2">@$2</a>');
const badge=u=>u.ver?`<span class="vb" title="Verified">${ic('check',15)}</span>`:'';
const av=(x,c='')=>`<a href="#u-${x.un}" class="av ${c}" style="background-color:hsl(${[...x.id].reduce((a,b)=>a+b.charCodeAt(0),0)*7%360} 70% 55%);${x.av?`background-image:url(${x.av})`:''}">${x.av?'':esc(x.name[0]||'?').toUpperCase()}</a>`;
const blk=(a,b)=>!!(u(a)?.bl.includes(b)||u(b)?.bl.includes(a));
const vis=p=>{const a=u(p.by);return a&&!blk(ME,p.by)&&(!a.priv||a.id==ME||a.fo.includes(ME))};
const score=p=>(p.lk.length+2*p.rp.length+db.posts.filter(x=>x.par==p.id).length+1)/Math.pow((Date.now()-p.ts)/36e5+2,1.2);
function notify(to,type,post){if(to==ME||!u(to))return;db.notifs.push({id:uid(),to,f:ME,type,post,ts:Date.now(),r:0})}
function mentions(tx,pid){[...tx.matchAll(/@(\w+)/g)].forEach(m=>{const x=byUn(m[1]);if(x&&!blk(ME,x.id))notify(x.id,'mention',pid)})}
const unread=()=>db.notifs.filter(n=>n.to==ME&&!n.r&&!blk(ME,n.f)).length,unm=()=>db.msgs.filter(m=>m.t==ME&&!m.r).length;
function route(){const h=location.hash.slice(1)||'home';if(h!=S.v){S.v=h;S.n=10;S.open=null;S.tab='p';S.load=1;setTimeout(()=>{S.load=0;render()},220)}render()}
function items(f){const o=[];db.posts.forEach(p=>{if(p.par||!vis(p)||(f&&!f(p)))return;o.push({p,ts:p.ts});p.rp.forEach(r=>{if(!blk(ME,r.u))o.push({p,ts:r.t,rb:r.u})})});return o.sort((a,b)=>S.feed=='r'?score(b.p)-score(a.p):b.ts-a.ts)}
function card(it,sub){const p=it.p,a=u(p.by),m=me(),lk=p.lk.includes(ME),rp=p.rp.some(r=>r.u==ME),bk=m.bk.includes(p.id),cm=db.posts.filter(x=>x.par==p.id);
const th=S.open==p.id?`<div style="margin-top:10px;border-top:1px solid var(--bd)">${cm.filter(c=>vis(c)).map(c=>card({p:c},1)).join('')}<div class="row" style="margin-top:10px"><input id="c-${p.id}" placeholder="Write a reply" maxlength="300"><button class="btn sm" data-a="cmt" data-id="${p.id}">Reply</button></div></div>`:'';
return `<article class="card">${it.rb?`<div class="mu" style="margin:-4px 0 6px 54px">${u(it.rb).name} reposted</div>`:''}<div class="row">${av(a,sub?'s':'')}<div class="fl"><div class="hd"><a href="#u-${a.un}" class="nm">${esc(a.name)}</a>${badge(a)}<span class="mu">@${a.un} · ${ago(p.ts)}</span></div><div class="tx">${fmt(p.tx)}</div>${p.md.length?`<div class="md">${p.md.map(x=>x.t=='v'?`<video src="${x.s}" controls></video>`:`<img src="${x.s}" alt="">`).join('')}</div>`:''}
${sub?'':`<div class="acts"><button data-a="open" data-id="${p.id}">${ic('comment',18)}${cm.length}</button><button class="${rp?'on':''}" data-a="rp" data-id="${p.id}">${ic('repost',18)}${p.rp.length}</button><button class="${lk?'on':''}" data-a="like" data-id="${p.id}">${ic('heart',18)}${p.lk.length}</button><button class="${bk?'on':''}" data-a="bk" data-id="${p.id}">${ic('bookmarks',18)}</button><button data-a="share" data-id="${p.id}">${ic('share',18)}</button><span class="gap"></span>${a.id==ME?`<button data-a="del" data-id="${p.id}">Delete</button>`:`<button data-a="rep" data-id="${p.id}">Report</button><button data-a="blk" data-id="${a.id}">Block</button>`}</div>`}${th}</div></div></article>`}
const empty=(t,s)=>`<div class="empty"><b>${t}</b>${s}</div>`;
function feedList(its){if(!its.length)return empty('Nothing here yet','Posts will show up here as people share.');return its.slice(0,S.n).map(i=>card(i)).join('')+(its.length>S.n?`<div class="pad" style="text-align:center"><button class="btn o" data-a="more">Load more</button></div>`:'')}
function composer(){return `<div class="card"><div class="row">${av(me())}<div class="fl"><textarea id="dt" rows="3" maxlength="500" placeholder="What's happening?">${esc(S.dt)}</textarea><div class="prev">${S.dm.map(x=>x.t=='v'?`<video src="${x.s}"></video>`:`<img src="${x.s}" alt="">`).join('')}</div><div class="row sp"><label class="btn o sm">Add media<input type="file" id="fm" multiple accept="image/*,video/*" hidden></label><button class="btn" data-a="post">Post</button></div></div></div></div>`}
function userRow(x){const m=me(),f=m.fg.includes(x.id);return `<div class="ct" style="cursor:default">${av(x)}<div class="fl"><div class="hd"><a href="#u-${x.un}" class="nm">${esc(x.name)}</a>${badge(x)}</div><div class="mu">@${x.un} · ${x.fo.length} followers</div></div><button class="btn sm ${f?'o':''}" data-a="fol" data-id="${x.id}">${f?'Following':'Follow'}</button></div>`}
function explore(){const q=S.q.trim().toLowerCase(),us=Object.values(db.users).filter(x=>x.id!=ME&&!blk(ME,x.id)),ps=db.posts.filter(p=>!p.par&&vis(p));
let h=`<div class="pad row"><input id="sq" placeholder="Search posts, people, #tags" value="${esc(S.q)}"><button class="btn" data-a="search">Search</button></div>`;
if(q){const rp=ps.filter(p=>p.tx.toLowerCase().includes(q)),ru=q[0]=='#'?[]:us.filter(x=>x.un.toLowerCase().includes(q)||x.name.toLowerCase().includes(q));
return h+(ru.length?`<div class="pad nm">People</div>${ru.map(userRow).join('')}`:'')+`<div class="pad nm">Posts</div>`+(rp.length?rp.map(p=>card({p})).join(''):empty('No results','Try another keyword or hashtag.'))}
const tg={};ps.forEach(p=>(p.tx.match(/#\w+/g)||[]).forEach(t=>tg[t.toLowerCase()]=(tg[t.toLowerCase()]||0)+1));const tt=Object.entries(tg).sort((a,b)=>b[1]-a[1]).slice(0,8);
const pop=[...us].sort((a,b)=>b.fo.length-a.fo.length).slice(0,5),sg=us.filter(x=>!me().fg.includes(x.id)).slice(0,4),tp=[...ps].sort((a,b)=>score(b)-score(a)).slice(0,4),ds=ps.map(p=>[p,db.posts.filter(c=>c.par==p.id).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,3);
return h+`<div class="pad nm">Trending hashtags</div><div class="pad" style="padding-top:0;display:flex;gap:8px;flex-wrap:wrap">${tt.length?tt.map(([t,c])=>`<a href="#explore" class="btn o sm" data-a="tag" data-v="${t.slice(1)}">${esc(t)} · ${c}</a>`).join(''):'<span class="mu">No hashtags yet. Use #tags in posts.</span>'}</div><div class="pad nm">Popular users</div>${pop.length?pop.map(userRow).join(''):'<div class="pad mu">No other users yet.</div>'}<div class="pad nm">Suggested accounts</div>${sg.length?sg.map(userRow).join(''):'<div class="pad mu">You follow everyone.</div>'}<div class="pad nm">Trending posts</div>${tp.length?tp.map(p=>card({p})).join(''):'<div class="pad mu">No posts yet.</div>'}<div class="pad nm">Popular discussions</div>${ds.length?ds.map(x=>card({p:x[0]})).join(''):'<div class="pad mu">No discussions yet.</div>'}`}
function notifs(){const l=db.notifs.filter(n=>n.to==ME&&!blk(ME,n.f)).sort((a,b)=>b.ts-a.ts),T={follow:'followed you',like:'liked your post',comment:'replied to your post',repost:'reposted your post',mention:'mentioned you',msg:'sent you a message'};
const h=l.length?l.map(n=>{const f=u(n.f),p=db.posts.find(x=>x.id==n.post);return `<a class="ct ${n.r?'':'un'}" href="${n.type=='msg'?'#messages':'#u-'+f.un}" data-a="${n.type=='msg'?'chat':''}" data-id="${f.id}">${av(f,'s')}<div class="fl"><b>${esc(f.name)}</b> ${T[n.type]} <span class="mu">${ago(n.ts)}</span>${p?`<div class="mu">${esc(p.tx.slice(0,80))}</div>`:''}</div>${n.r?'':'<span class="dot">new</span>'}</a>`}).join(''):empty('No notifications','Likes, replies, follows and mentions appear here.');
l.forEach(n=>n.r=1);setTimeout(()=>{save();const d=$('.side .dot,.bot .dot');},1500);return h}
function messages(){const m=me();if(S.chat&&u(S.chat)){const x=u(S.chat),l=db.msgs.filter(q=>(q.f==ME&&q.t==x.id)||(q.f==x.id&&q.t==ME)).sort((a,b)=>a.ts-b.ts);l.forEach(q=>{if(q.t==ME)q.r=1});save();
return `<div class="ct" style="cursor:default"><button data-a="back">Back</button>${av(x,'s')}<div class="fl"><b>${esc(x.name)}</b>${badge(x)}<div class="mu">@${x.un}${x.bio?' · '+esc(x.bio.slice(0,60)):''}</div></div></div><div class="pad" style="min-height:50dvh">${l.length?l.map(q=>`<div class="bub ${q.f==ME?'me':'th'}">${esc(q.tx)}<div class="mu" style="color:inherit;opacity:.6;font-size:11px">${ago(q.ts)}</div></div>`).join(''):empty('Say hello','Start the conversation.')}</div><div class="pad row"><input id="mi" placeholder="Message @${x.un}" maxlength="1000"><button class="btn" data-a="send">Send</button></div>`}
const ids=[...new Set(db.msgs.filter(q=>q.f==ME||q.t==ME).map(q=>q.f==ME?q.t:q.f))].filter(i=>u(i)&&!blk(ME,i)).map(i=>{const l=db.msgs.filter(q=>(q.f==ME&&q.t==i)||(q.f==i&&q.t==ME));return{x:u(i),last:l.sort((a,b)=>b.ts-a.ts)[0],n:l.filter(q=>q.t==ME&&!q.r).length}}).sort((a,b)=>b.last.ts-a.last.ts);
return `<div class="pad row"><input id="nu" placeholder="Message a user by @username"><button class="btn" data-a="newchat">Go</button></div>`+(ids.length?ids.map(c=>`<div class="ct ${c.n?'un':''}" data-a="chat" data-id="${c.x.id}">${av(c.x)}<div class="fl"><b>${esc(c.x.name)}</b> <span class="mu">${ago(c.last.ts)}</span><div class="mu">${esc(c.last.tx.slice(0,60))}</div></div>${c.n?`<span class="dot">${c.n}</span>`:''}</div>`).join(''):empty('No conversations','Message someone from their profile.'))}
function profile(un){const x=byUn(un);if(!x||blk(ME,x.id))return empty('Account not found','This profile does not exist or is unavailable.');const own=x.id==ME,f=me().fg.includes(x.id),lock=x.priv&&!own&&!x.fo.includes(ME);
let l=[];if(!lock){const all=db.posts.filter(p=>vis(p));l=S.tab=='p'?items(p=>p.by==x.id).concat(items(p=>0)).filter(i=>i.p.by==x.id||i.rb==x.id):S.tab=='r'?all.filter(p=>p.par&&p.by==x.id).map(p=>({p})):S.tab=='m'?all.filter(p=>!p.par&&p.by==x.id&&p.md.length).map(p=>({p})):all.filter(p=>p.lk.includes(x.id)).map(p=>({p}))}
return `<div class="ban" style="${x.bn?`background-image:url(${x.bn})`:''}"></div><div class="pad"><div class="row sp" style="align-items:flex-start">${av(x,'l')}<div class="row">${own?'<a class="btn o" href="#settings">Edit profile</a>':`<button class="btn o" data-a="chat" data-id="${x.id}">Message</button><button class="btn ${f?'o':''}" data-a="fol" data-id="${x.id}">${f?'Unfollow':'Follow'}</button>`}</div></div><div class="hd" style="margin-top:8px"><b style="font-size:20px">${esc(x.name)}</b>${badge(x)}</div><div class="mu">@${x.un}${x.priv?' · Private':''}</div><div style="margin:8px 0">${fmt(x.bio||'')}</div><div class="mu">Joined ${new Date(x.j).toLocaleDateString(undefined,{month:'long',year:'numeric'})} · <b style="color:var(--tx)">${x.fg.length}</b> following · <b style="color:var(--tx)">${x.fo.length}</b> followers</div></div><div class="tabs">${[['p','Posts'],['r','Replies'],['m','Media'],['l','Likes']].map(t=>`<button class="${S.tab==t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${lock?empty('This account is private','Follow to see their posts.'):l.length?l.slice(0,S.n).map(i=>card(i)).join(''):empty('Nothing here yet','')}`}
function settings(){const m=me();return `<div class="pad"><label class="f">Display name</label><input id="s-n" value="${esc(m.name)}" maxlength="40"><label class="f">Username</label><input id="s-u" value="${esc(m.un)}" maxlength="15"><label class="f">Biography</label><textarea id="s-b" maxlength="160" rows="3">${esc(m.bio)}</textarea><label class="f">Profile picture</label><input type="file" id="fa" accept="image/*"><label class="f">Banner</label><input type="file" id="fb" accept="image/*"><label class="f"><input type="checkbox" id="s-p" ${m.priv?'checked':''} style="width:auto"> Private account (only followers see my posts)</label><div class="err" id="e1"></div><button class="btn" data-a="saveprof">Save profile</button>
<h3>Password</h3><input type="password" id="p0" placeholder="Current password"><div style="height:8px"></div><input type="password" id="p1" placeholder="New password (8+ characters)"><div class="err" id="e2"></div><button class="btn o" data-a="savepw">Change password</button>
<h3>Theme</h3><div class="row"><button class="btn ${m.theme!='light'?'':'o'}" data-a="theme" data-v="dark">Dark</button><button class="btn ${m.theme=='light'?'':'o'}" data-a="theme" data-v="light">Light</button></div>
<h3>Blocked users</h3>${m.bl.length?m.bl.map(i=>u(i)?`<div class="row sp" style="margin:6px 0"><span>@${u(i).un}</span><button class="btn o sm" data-a="unblk" data-id="${i}">Unblock</button></div>`:'').join(''):'<div class="mu">No blocked users.</div>'}<h3>Account</h3><button class="btn d" data-a="logout">Log out</button><p class="mu">Local development mode: data lives in this browser. See the Supabase notes provided with this build.</p></div>`}
function render(){const el=document.documentElement;if(!ME||!me()){el.dataset.theme='dark';return authView()}const m=me();el.dataset.theme=m.theme||'dark';
const nav=[['home','Home','home'],['explore','Explore','explore'],['notifications','Notifications','notifications'],['messages','Messages','messages'],['create','Create Post','create'],['bookmarks','Bookmarks','bookmarks'],['u-'+m.un,'Profile','user'],['settings','Settings','settings']],un=unread(),um=unm();
const cnt=k=>k=='notifications'&&un?`<span class="dot">${un}</span>`:k=='messages'&&um?`<span class="dot">${um}</span>`:'';
const on=k=>k==S.v?'on':'';let T,B;const v=S.v;
if(S.load){T=v.startsWith('u-')?'Profile':nav.find(n=>n[0]==v)?.[1]||'Ligma-Social';B='<div class="sk"></div><div class="sk"></div><div class="sk"></div>'}
else if(v=='home'){T='Home';B=composer()+`<div class="tabs"><button class="${S.feed=='c'?'on':''}" data-a="feed" data-v="c">Latest</button><button class="${S.feed=='r'?'on':''}" data-a="feed" data-v="r">Recommended</button></div>`+feedList(items())}
else if(v=='create'){T='Create Post';B=composer()}else if(v=='explore'){T='Explore';B=explore()}else if(v=='notifications'){T='Notifications';B=notifs()}else if(v=='messages'){T='Messages';B=messages()}
else if(v=='bookmarks'){T='Bookmarks';const l=m.bk.map(i=>db.posts.find(p=>p.id==i)).filter(p=>p&&vis(p));B=l.length?l.map(p=>card({p})).join(''):empty('No bookmarks','Bookmark posts to find them here.')}
else if(v=='settings'){T='Settings';B=settings()}else if(v.startsWith('u-')){T='Profile';B=profile(v.slice(2))}else{T='Not found';B=empty('Page not found','Use the navigation to get back.')}
const a=document.activeElement,id=a&&a.id,val=a&&a.value;
$('#app').innerHTML=`<div class="app"><nav class="side"><div class="logo"><span class="lg">L</span>Ligma-Social</div>${nav.map(n=>`<a class="ni ${on(n[0])}" href="#${n[0]}">${ic(n[2])}${n[1]}${cnt(n[0])}</a>`).join('')}<div class="gap"></div><div class="ni" style="cursor:default">${av(m,'s')}<span>@${m.un}</span></div></nav><main class="main"><div class="top"><span>${T}</span></div>${B}</main><nav class="bot">${nav.map(n=>`<a class="${on(n[0])}" href="#${n[0]}" aria-label="${n[1]}">${ic(n[2],22)}${cnt(n[0])}</a>`).join('')}</nav></div>`;
if(id&&$('#'+id)&&id!='dt'){$('#'+id).value=val;$('#'+id).focus()}}
function authView(){const r=S.auth=='up';$('#app').innerHTML=`<div class="auth"><div class="logo"><span class="lg">L</span>Ligma-Social</div><p class="mu" style="text-align:center">${r?'Create your account':'Welcome back'}</p>${r?'<label class="f">Username</label><input id="a-u" maxlength="15" autocomplete="username"><label class="f">Email</label><input id="a-e" type="email" autocomplete="email">':'<label class="f">Username or email</label><input id="a-u" autocomplete="username">'}<label class="f">Password</label><input id="a-p" type="password" autocomplete="${r?'new-password':'current-password'}"><div class="err">${esc(S.err)}</div><button class="btn" style="width:100%" data-a="auth">${r?'Create account':'Log in'}</button><p style="text-align:center"><button class="mu" data-a="swap">${r?'Have an account? Log in':'New here? Register'}</button></p></div>`}
const rd=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{if(!f.type.startsWith('image/'))return r(f.size>1.2e6?null:{t:'v',s:fr.result});const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r({t:'i',s:c.toDataURL('image/jpeg',.72)})};i.onerror=()=>r(null);i.src=fr.result};fr.readAsDataURL(f)});
const val=i=>($('#'+i)?.value||'').trim();
document.addEventListener('input',e=>{if(e.target.id=='dt')S.dt=e.target.value});
document.addEventListener('keydown',e=>{if(e.key!='Enter'||e.shiftKey)return;const id=e.target.id,b={sq:'search',mi:'send',nu:'newchat','a-p':'auth'}[id]||(id.startsWith('c-')?'cmt':'');if(b){e.preventDefault();act(b,{id:id.slice(2)})}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id=='fm'){for(const f of [...t.files].slice(0,4-S.dm.length)){const x=await rd(f);x?S.dm.push(x):toast('Video too large (max ~1MB in local mode)')}render()}
if(t.id=='fa'||t.id=='fb'){const x=await rd(t.files[0]);if(x){me()[t.id=='fa'?'av':'bn']=x.s;save();render();toast('Image updated')}}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&t.dataset.a)act(t.dataset.a,t.dataset)});
window.addEventListener('storage',()=>{load();const a=document.activeElement;if(!a||!/INPUT|TEXTAREA/.test(a.tagName))render()});window.addEventListener('hashchange',route);
async function act(a,d){load();const m=me(),p=db.posts.find(x=>x.id==d.id);
if(a=='swap'){S.auth=S.auth=='in'?'up':'in';S.err='';return render()}
if(a=='auth'){const un=val('a-u'),pw=$('#a-p').value;S.err='';
if(S.auth=='up'){const em=val('a-e');if(!/^\w{3,15}$/.test(un))S.err='Username: 3-15 letters, numbers or underscores.';else if(byUn(un))S.err='That username is taken.';else if(!/^\S+@\S+\.\S+$/.test(em))S.err='Enter a valid email.';else if(Object.values(db.users).some(x=>x.em==em.toLowerCase()))S.err='Email already registered.';else if(pw.length<8)S.err='Password needs 8+ characters.';
if(!S.err){const id=uid();db.users[id]={id,un,name:un,em:em.toLowerCase(),pw:await hs(pw),bio:'',av:'',bn:'',fo:[],fg:[],bl:[],bk:[],priv:false,ver:!Object.keys(db.users).length,theme:'dark',j:Date.now()};save();ME=id;try{sessionStorage.setItem('ls-me',id)}catch(e){}location.hash='home';S.v='';return route()}}
else{const x=Object.values(db.users).find(x=>x.un.toLowerCase()==un.toLowerCase()||x.em==un.toLowerCase());if(!x||x.pw!=await hs(pw))S.err='Invalid credentials.';else{ME=x.id;try{sessionStorage.setItem('ls-me',ME)}catch(e){}S.v='';return route()}}
return render()}
if(!m)return;const R=()=>{save();render()};
switch(a){
case'logout':ME=null;try{sessionStorage.removeItem('ls-me')}catch(e){}return render();
case'tag':S.q='#'+d.v;return render();case'search':S.q=val('sq');return render();case'more':S.n+=10;return render();case'feed':S.feed=d.v;return render();case'tab':S.tab=d.v;S.n=10;return render();
case'open':S.open=S.open==d.id?null:d.id;return render();
case'post':{const tx=$('#dt').value.trim();if(!tx&&!S.dm.length)return toast('Write something or add media');const id=uid();db.posts.push({id,by:ME,tx,md:S.dm,ts:Date.now(),lk:[],rp:[],par:null});mentions(tx,id);S.dt='';S.dm=[];toast('Posted');if(S.v=='create')location.hash='home';return R()}
case'cmt':{const tx=val('c-'+d.id);if(!tx||!p)return toast('Write a reply first');const id=uid();db.posts.push({id,by:ME,tx,md:[],ts:Date.now(),lk:[],rp:[],par:p.id});notify(p.by,'comment',p.id);mentions(tx,id);return R()}
case'like':{if(!p)return;const i=p.lk.indexOf(ME);i<0?(p.lk.push(ME),notify(p.by,'like',p.id)):p.lk.splice(i,1);return R()}
case'rp':{if(!p)return;const i=p.rp.findIndex(r=>r.u==ME);i<0?(p.rp.push({u:ME,t:Date.now()}),notify(p.by,'repost',p.id)):p.rp.splice(i,1);return R()}
case'bk':{const i=m.bk.indexOf(d.id);i<0?m.bk.push(d.id):m.bk.splice(i,1);return R()}
case'share':try{await navigator.clipboard.writeText(location.href.split('#')[0]+'#home');toast('Link copied')}catch(e){toast('Copy not available here')}return;
case'del':if(p&&p.by==ME&&confirm('Delete this post?')){db.posts=db.posts.filter(x=>x.id!=p.id&&x.par!=p.id)}return R();
case'rep':{const r=prompt('Why are you reporting this post?');if(r&&r.trim()){db.reports.push({id:uid(),post:d.id,by:ME,reason:r.trim().slice(0,300),ts:Date.now()});toast('Report submitted')}return save()}
case'blk':if(confirm('Block this user?')){const x=u(d.id);m.bl.push(x.id);m.fg=m.fg.filter(i=>i!=x.id);m.fo=m.fo.filter(i=>i!=x.id);x.fo=x.fo.filter(i=>i!=ME);x.fg=x.fg.filter(i=>i!=ME);toast('User blocked')}return R();
case'unblk':m.bl=m.bl.filter(i=>i!=d.id);return R();
case'fol':{const x=u(d.id);if(!x||x.id==ME)return;const i=m.fg.indexOf(x.id);if(i<0){m.fg.push(x.id);x.fo.push(ME);notify(x.id,'follow')}else{m.fg.splice(i,1);x.fo=x.fo.filter(j=>j!=ME)}return R()}
case'chat':S.chat=d.id;if(location.hash!='#messages')location.hash='messages';return render();case'back':S.chat=null;return render();
case'newchat':{const x=byUn(val('nu').replace('@',''));if(!x||x.id==ME||blk(ME,x.id))return toast('User not found');S.chat=x.id;return render()}
case'send':{const tx=val('mi');if(!tx||!S.chat)return;if(blk(ME,S.chat))return toast('Cannot message this user');db.msgs.push({id:uid(),f:ME,t:S.chat,tx,ts:Date.now(),r:0});notify(S.chat,'msg');save();render();return $('#mi')?.focus()}
case'theme':m.theme=d.v;return R();
case'saveprof':{const n=val('s-n'),un=val('s-u'),b=val('s-b'),x=byUn(un);let er='';if(!n)er='Display name is required.';else if(!/^\w{3,15}$/.test(un))er='Username: 3-15 letters, numbers or underscores.';else if(x&&x.id!=ME)er='That username is taken.';
if(er){$('#e1').textContent=er;return}m.name=n;m.un=un;m.bio=b;m.priv=$('#s-p').checked;toast('Profile saved');return R()}
case'savepw':{const n=$('#p1').value;if(m.pw!=await hs($('#p0').value))return $('#e2').textContent='Current password is wrong.';if(n.length<8)return $('#e2').textContent='New password needs 8+ characters.';m.pw=await hs(n);toast('Password changed');return R()}}}
load();route();
